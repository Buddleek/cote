[package]
name = "cote"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tauri 2 backend and application entry for the Cote editor"

[lib]
name = "cote_lib"
crate-type = ["rlib"]

[features]
# tauri build 时由 CLI 自动启用：生产模式内嵌 dist 资源而非 devUrl
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }
editor-core = { workspace = true }
syntax-engine = { workspace = true }
platform = { workspace = true }
script-host = { workspace = true }

# release GUI 子系统下向父终端输出（--version/--help）
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_System_Console"] }
